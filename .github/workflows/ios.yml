name: iOS

# The split this workflow exists to serve:
#
#   UsageLimitsKit  — Foundation only, no Apple SDK. Builds and tests on Linux, so the quota
#                     engine is verified on every push without needing a Mac at all.
#   UsageLimits app — SwiftUI, WidgetKit, Keychain, ASWebAuthenticationSession. Needs the real
#                     iOS SDK, so a macOS runner is the only thing that can honestly say it
#                     compiles.
#
# That is not an arbitrary boundary. On the Android side every real defect found — inverted
# percentages, a missing `config` envelope, windows classified by payload position — was in a
# parser. None was in a view. So the layer that can be tested without Apple hardware is also
# the layer where the bugs actually live.

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-linux:
    name: UsageLimitsKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: ios/UsageLimitsKit
        run: swift build -v
      - name: Test
        working-directory: ios/UsageLimitsKit
        run: swift test --parallel

  kit-macos:
    name: UsageLimitsKit (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: ios/UsageLimitsKit
        run: swift test --parallel

  app-ios:
    name: iOS app (real SDK)
    runs-on: macos-latest
    # The project is generated from project.yml rather than committed: a .pbxproj conflicts on
    # every branch and nobody can review a diff of one. This job is the only place the SwiftUI
    # and WidgetKit code is compiled at all, since the environment it was written in has no
    # Apple SDK — so a failure here is the real signal, not a formality.
    #
    # It deliberately carries no `if:` guard. It had one — `hashFiles(...) != ''`, meaning "only
    # if the spec is there" — and `hashFiles` is not available in a JOB-level condition: it reads
    # the workspace, which does not exist before a job checks anything out. GitHub rejected the
    # whole workflow at startup, so all three jobs never ran and every push for a day reported a
    # failure with no logs and no job list to explain it. The spec is committed; the guard was
    # protecting against nothing.
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: ios/UsageLimits
        run: xcodegen generate
      # A GENERIC destination for the build, not a named device. `name=iPhone 16` failed on the
      # runner for a reason that had nothing to do with the code: Xcode 26 ships simulators for
      # the iPhone 17 family and the 16 is simply not among them, so xcodebuild exited before
      # compiling a single file. Any pinned model rots the same way at the next Xcode bump.
      - name: Build for simulator
        working-directory: ios/UsageLimits
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme UsageLimits \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # The device is DISCOVERED, for the same reason the build destination is generic: any
      # hardcoded model is a future failure that has nothing to do with the code. This picks
      # whatever iPhone the installed Xcode actually has, and fails loudly if there is none
      # rather than silently skipping the tests below.
      - name: Pick and boot a simulator
        id: simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "no available iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      # The only step that RUNS the app. Everything above proves the types line up; this proves
      # the binary launches, the tab bar appears, and each screen opens on a fresh install with
      # nothing signed in — the failures a user meets before any of the others.
      - name: Run the app on the simulator
        working-directory: ios/UsageLimits
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme UsageLimits \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      # Kept on failure only, because a UI test that fails is unreadable from console output
      # alone: the bundle carries the screenshot and the view hierarchy at the moment it broke.
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
