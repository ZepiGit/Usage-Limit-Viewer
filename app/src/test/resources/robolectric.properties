# A plain Application for every Robolectric test unless the class says otherwise.
#
# The manifest's UsageLimitsApp launches background work on create — WorkManager and its
# database — that outlives the test that started it. Left running, it races the native
# runtime set-up of the next sandbox in the same JVM: Robolectric unpacks its fonts through
# a process-wide zip filesystem, the second opener gets FileSystemAlreadyExistsException, and
# every SQLite call in that sandbox then fails with UnsatisfiedLinkError. AppLaunchTest is the
# one class that opts back in, and it waits for the work it starts.
application=android.app.Application
